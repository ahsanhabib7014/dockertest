version: '3.8'

services:
  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs_secured_app
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    security_opt:
      - no-new-privileges:true  # কন্টেইনারের ভেতর প্রিভিলেজ এসকেলেশন (Privilege Escalation) বন্ধ করে

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx_secured_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs-app
    security_opt:
      - no-new-privileges:true