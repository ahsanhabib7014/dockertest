version: '3.8'

services:
  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs_max_secured_app
    restart: always
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
    # --- হাই সিকিউরিটি ফ্ল্যাগসমূহ ---
    security_opt:
      - no-new-privileges:true  # সুডোকল বা প্রিভিলেজ এসকেলেশন সম্পূর্ণ ব্লক করে
    read_only: true             # ফাইল সিস্টেম রিড-ওনলি করে দেয়, হ্যাকার ম্যালওয়্যার ফাইল রাইট করতে পারবে না
    tmpfs:
      - /tmp                    # Next.js বা অ্যাপের সাময়িক কাজের জন্য মেমোরিতে ছোট টেম্প ফোল্ডার
      - /app/.next/cache        # ক্যাশ জেনারেট করার জন্য টেম্প পাথ
    cap_drop:
      - ALL                     # সব ধরনের লিনাক্স ক্যাপাবিলিটি ড্রপ (বর্জন) করা হলো
    cap_add:
      - NET_BIND_SERVICE        # শুধু নেটওয়ার্ক বাইন্ড করার অনুমতি রাখা হলো
    mem_limit: 512m             # DDoS বা রিসোর্স এক্সহশন অ্যাটাক (RAM flooding) রোধ করতে মেমোরি লিমিট
    cpus: '0.5'                 # সিপিইউ ব্যবহার সীমিত করা হলো