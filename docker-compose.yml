services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dockertest_app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/dockertest
      JWT_SECRET: change-this-to-a-long-random-secret
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: dockertest_mongo
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data: