events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # DDoS / Rate Limiting সেটআপ (প্রতি সেকেন্ডে সর্বোচ্চ ১০টি রিকোয়েস্ট)
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    server {
        listen 80;
        server_name _;

        # ১. ফাইল সাইজ লিমিট (Malicious Big File Upload বন্ধ করতে)
        client_max_body_size 10M;

        # ২. Nginx Server Version হাইড করা (Information Disclosure বন্ধ করতে)
        server_tokens off;

        # ৩. সিকিউরিটি হেডারসমূহ (Security Headers)
        add_header X-Frame-Options "SAMEORIGIN" always;              # Clickjacking Protection
        add_header X-XSS-Protection "1; mode=block" always;           # XSS Protection
        add_header X-Content-Type-Options "nosniff" always;           # MIME Sniffing Protection
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline';" always;

        location / {
            # Rate Limiting প্রয়োগ করা
            limit_req zone=req_limit_per_ip burst=20 nodelay;
            limit_conn conn_limit_per_ip 10;

            proxy_pass http://nextjs-app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # আসল ক্লায়েন্ট IP ধরে রাখার জন্য
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}